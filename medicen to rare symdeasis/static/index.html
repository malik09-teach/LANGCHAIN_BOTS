<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symptom-to-Rare-Disease Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo">🧬</div>
            <div class="header-text">
                <h1>Clinical Differential Assistant</h1>
                <p>Decision-support aid for rare diseases</p>
            </div>
        </header>

        <div class="chat-container" id="chatContainer">
            <div class="message system">
                <div class="message-content">
                    <p>Welcome. I am a decision-support aid designed to help formulate rare disease differentials. Please provide the patient's initial symptoms and history. Note: I am not a diagnostic instrument.</p>
                </div>
            </div>
        </div>

        <div class="input-area">
            <form id="chatForm">
                <input type="text" id="userInput" placeholder="Type clinical notes or symptoms here..." autocomplete="off" required>
                <button type="submit" id="sendBtn">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </form>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
